# hello-lambda v1 — spec 007 reference implementation ("answer key"):
# the 006 crate EVOLVED at its emit seam (S6b) — accepted events now land
# in S3 instead of stdout. The 006 reference stays untouched next door as
# the no-SDK baseline the S8 size bill is measured against.
#
# Course reference — lives OUTSIDE the cargo workspace on purpose (the
# learner's own crate is crates/hello-lambda, evolved in place). The empty
# [workspace] table below is the opt-out that keeps `cargo` from walking
# up to the repo root.

[package]
name = "hello-lambda"
version = "0.2.0" # v1 (spec 007) — evolved from the 006 reference (0.1.0)
edition = "2024"

[workspace]

[dependencies]
# 006's H7 said "deliberately absent: aws-sdk-*". S6b SUPERSEDES that rule
# for this evolved crate — the SDK arriving is the whole point, and S8
# measures exactly what it costs (006's 1,843,256-byte bootstrap is the
# baseline). The SDK itself still isn't named here: it comes through
# lake-store's `s3` feature (default), so it stays confined to the one
# module the design allows it in (S7).
lake-store = { path = "../lake-store" }
# Credential/region/endpoint resolution — the async config load that
# main.rs performs ONCE, before lambda_http::run (cold-start discipline).
aws-config = "1"

# --- everything below is 006, unchanged ---
lambda_http = { version = "1.3", default-features = false, features = [
    "apigw_http",
    "tracing",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
] }
# The 004 payoff, third caller: the door's classification comes from the
# learner's OWN glake library — same call relay makes, so 202/400 behavior
# is identical by construction (and H4 proves it instead of hoping).
glake = { path = "../../../004-glake-traits/_reference/glake" }

[dev-dependencies]
# The FAKE side of the seam (S6): tests inject FakeStore through the same
# generic handler core production runs S3Store through. dev-only, so the
# release bootstrap never contains it.
lake-store = { path = "../lake-store", features = ["fake"] }
proptest = "1"
# The H4 oracle: relay ITSELF (the 005 reference lib) is a dev-dependency,
# driven in-process through its axum Router — tower's oneshot + axum types
# exist here only to speak to it. None of this ships in the bootstrap.
relay = { path = "../../../005-async-relay/_reference/relay" }
tower = { version = "0.5", features = ["util"] }
axum = "0.8"
# The prop test builds relay's channel itself (no writer task — see
# tests/prop_door.rs); dev-only feature union adds `sync` for tests.
tokio = { version = "1", features = ["sync"] }

[lints.clippy]
# Same as relay's A9/006's H7 lint half: a deployable crate bans
# unwrap()/expect() outright — a panicking handler takes the whole instance
# down mid-request (the Cloudflare Nov-2025 lesson). Tests re-allow it at
# module level: a panicking test is a FAILING test, which is fine.
unwrap_used = "deny"
expect_used = "deny"

# REPLICATED VERBATIM from the workspace root (/Cargo.toml). This reference
# lives outside the workspace (see the [workspace] opt-out above), so cargo
# would otherwise build it with stock release defaults — and S8's artifact
# size would be measured on a DIFFERENT profile than the one the learner's
# crates/hello-lambda inherits from the root. Same flags or the number lies.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[lib]
name = "hello_lambda"
path = "src/lib.rs"

[[bin]]
name = "hello-lambda"
path = "src/main.rs"
